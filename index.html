<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearHealth - Medical Information Simplified</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar with Language Dropdown -->
  <header class="navbar">
    <div class="logo">✨ ClearHealth</div>
    <div class="lang-container">
      <select id="lang-select" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>
    </div>
  </header>

  <main>
    <!-- Hero / Search Section -->
    <section class="hero">
      <h1>Medical information, simplified.</h1>
      <p>Understand your health in simple, everyday language.</p>
      
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search a condition (e.g., Diabetes, Anemia, Gout)...">
        <button id="search-btn">Search</button>
      </div>

      <!-- Category Filter Chips -->
      <div class="categories">
        <button class="chip-btn" onclick="filterByCategory('all', this)">All</button>
        <button class="chip-btn" onclick="filterByCategory('Heart & Blood', this)">Heart & Blood</button>
        <button class="chip-btn" onclick="filterByCategory('Joints & Bones', this)">Joints & Bones</button>
        <button class="chip-btn" onclick="filterByCategory('Kidney & Sugar', this)">Kidney & Sugar</button>
        <button class="chip-btn" onclick="filterByCategory('Lungs & Breathing', this)">Lungs & Breathing</button>
        <button class="chip-btn" onclick="filterByCategory('Brain & Mental', this)">Brain & Mental</button>
        <button class="chip-btn" onclick="filterByCategory('Stomach & Digestion', this)">Stomach & Digestion</button>
        <button class="chip-btn" onclick="filterByCategory('Skin', this)">Skin</button>
      </div>
    </section>

    <!-- Results Display Card (Hidden by default) -->
    <section id="results-card" class="results-card" style="display: none;">
      <div class="card-header">
        <span id="res-badge" class="badge">Category</span>
        <h2 id="res-title">Condition Title</h2>
      </div>
      
      <!-- Emergency Warning Box -->
      <div id="emergency-box" class="emergency-box" style="display: none;">
        <strong>🚨 When to Seek Immediate Care:</strong>
        <p id="res-emergency-text"></p>
      </div>

      <div class="card-body">
        <h3 id="res-what-label">What is it?</h3>
        <p id="res-what-text"></p>

        <h3 id="res-lifestyle-label">Simple Daily Tips:</h3>
        <div id="res-action-grid" class="action-grid"></div>
      </div>
    </section>
  </main>

  <!-- Link to your script.js file -->
  <script src="script.js"></script>
</body>
</html>
