<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearHealth - Simplified Medical Information</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">🌸</span>
      <span class="logo-text">ClearHealth</span>
    </div>
    <div class="nav-controls">
      <select id="lang-select" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
        <option value="am">አማርኛ</option>
        <option value="vi">Tiếng Việt</option>
      </select>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1 id="search-title">Medical information, simplified.</h1>
      <p id="search-subtitle">Understand your health in simple, everyday language.</p>
      
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search a condition (e.g., Diabetes, Flu, Gout)..." 
        />
        <button id="search-btn" onclick="runSearch()">Search</button>
      </div>

      <div class="category-chips">
        <button class="chip-btn active" onclick="filterByCategory('all', this)">All Topics</button>
        <button class="chip-btn" onclick="filterByCategory('Heart', this)">🫀 Heart & Blood</button>
        <button class="chip-btn" onclick="filterByCategory('Lungs', this)">🫁 Lungs & Breathing</button>
        <button class="chip-btn" onclick="filterByCategory('Brain', this)">🧠 Brain & Mental</button>
        <button class="chip-btn" onclick="filterByCategory('Urinary', this)">💧 Kidney & Sugar</button>
        <button class="chip-btn" onclick="filterByCategory('Emergencies', this)">🚨 Emergencies</button>
      </div>
    </section>

    <section id="results-card" class="results-card" style="display: none;">
      <div class="card-header">
        <span id="res-badge" class="badge"></span>
        <h2 id="res-title"></h2>
      </div>

      <div class="card-body">
        <div class="info-group">
          <h3 id="res-what-label">What is it?</h3>
          <p id="res-what-text"></p>
        </div>

        <div class="info-group">
          <h3 id="res-lifestyle-label">Simple Daily Tips:</h3>
          <div id="res-action-grid" class="action-grid"></div>
        </div>

        <div id="emergency-box" class="emergency-box" style="display: none;">
          <div class="emergency-icon">🚨</div>
          <div>
            <strong id="res-emergency-label">When to Seek Immediate Care:</strong>
            <p id="res-emergency-text"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>ClearHealth is for educational purposes only and does not provide medical diagnosis or treatment.</p>
  </footer>

</body>
</html>
