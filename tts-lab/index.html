<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Health - TTS Lab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #FAF8F2;
      color: #0D273D;
    }
    h1 { color: #3E6985; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #CDD7DF;
      margin-bottom: 20px;
    }
    select, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #A6BED1;
      font-size: 14px;
    }
    button {
      background: #3E6985;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0D273D; }
    .voice-list {
      max-height: 200px;
      overflow-y: auto;
      background: #FFF9E3;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>TTS Laboratory</h1>
  <p>Test browser speech voices for Vietnamese, Amharic, Mandarin, Spanish, and English.</p>

  <div class="card">
    <h3>1. Available System Voices</h3>
    <button onclick="detectVoices()">Scan Device Voices</button>
    <div id="voice-count" style="margin-top: 10px; font-weight: bold;"></div>
    <div class="voice-list" id="voice-list">Click above to list pre-installed voices on your device.</div>
  </div>

  <div class="card">
    <h3>2. Test Playback</h3>
    
    <label for="lang-select">Choose Language Test:</label>
    <select id="lang-select" onchange="loadSampleText()">
      <option value="en">English (US)</option>
      <option value="es">Spanish (Español)</option>
      <option value="zh">Mandarin (中文)</option>
      <option value="vi">Vietnamese (Tiếng Việt)</option>
      <option value="am">Amharic (አማርኛ)</option>
    </select>

    <textarea id="test-text" rows="3"></textarea>

    <button onclick="speakTest()">Play Audio</button>
    <button onclick="stopTest()" style="background: #A6BED1; margin-top: 5px;">Stop</button>
  </div>

  <script>
    const sampleTexts = {
      en: "High blood pressure means the fluid inside is pushing too hard against your blood vessels.",
      es: "La presión alta significa que la sangre empuja demasiado fuerte las paredes de sus venas.",
      zh: "高血压意味着血液对血管壁的推力过大。",
      vi: "Cao huyết áp là khi dòng máu đẩy quá mạnh vào thành mạch máu.",
      am: "ከፍተኛ የደም ግፊት ማለት ደም በደም ሥሮች ላይ በኃይል እየገፋ ነው ማለት ነው።"
    };

    const langCodes = {
      en: 'en-US',
      es: 'es-ES',
      zh: 'zh-CN',
      vi: 'vi-VN',
      am: 'am-ET'
    };

    // Load initial sample text
    document.getElementById('test-text').value = sampleTexts.en;

    function loadSampleText() {
      const selected = document.getElementById('lang-select').value;
      document.getElementById('test-text').value = sampleTexts[selected];
    }

    function detectVoices() {
      if (!('speechSynthesis' in window)) {
        alert("Speech Synthesis is not supported in this browser.");
        return;
      }

      const voices = window.speechSynthesis.getVoices();
      const listEl = document.getElementById('voice-list');
      const countEl = document.getElementById('voice-count');

      countEl.innerText = `Total Voices Found: ${voices.length}`;
      listEl.innerHTML = '';

      if (voices.length === 0) {
        listEl.innerText = "No voices detected yet. Try clicking again in 2 seconds (some browsers load voices asynchronously).";
        return;
      }

      voices.forEach(voice => {
        const div = document.createElement('div');
        div.innerText = `• ${voice.name} (${voice.lang}) ${voice.default ? '— [DEFAULT]' : ''}`;
        listEl.appendChild(div);
      });
    }

    // Auto-trigger voice load for Chrome/Safari
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = detectVoices;
    }

    function speakTest() {
      if (!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel(); // Stop any active speech

      const text = document.getElementById('test-text').value;
      const langKey = document.getElementById('lang-select').value;
      const utterance = new SpeechSynthesisUtterance(text);

      utterance.lang = langCodes[langKey];

      // Try to find a matching voice explicitly
      const voices = window.speechSynthesis.getVoices();
      const matchingVoice = voices.find(v => v.lang.startsWith(langCodes[langKey]) || v.lang.startsWith(langKey));

      if (matchingVoice) {
        utterance.voice = matchingVoice;
        console.log(`Using voice: ${matchingVoice.name}`);
      } else {
        console.warn(`No exact voice matched for ${langCodes[langKey]}. Falling back to browser default.`);
      }

      window.speechSynthesis.speak(utterance);
    }

    function stopTest() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
